services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: cropshock-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET_KEY
        value: cropshock_enterprise_jwt_secret_gujarat_2026

  # 2. React 19 Frontend Static Site
  - type: web
    name: cropshock-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


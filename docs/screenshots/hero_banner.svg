<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a152d"/>
      <stop offset="100%" stop-color="#0b1b36"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <path d="M 50 0 V 420 M 150 0 V 420 M 250 0 V 420 M 350 0 V 420 M 450 0 V 420 M 550 0 V 420 M 650 0 V 420 M 750 0 V 420 M 850 0 V 420 M 950 0 V 420 M 1050 0 V 420 M 1150 0 V 420" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200 M 0 360 H 1200" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>

  <!-- Glowing accent orb -->
  <circle cx="1020" cy="120" r="140" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="180" cy="350" r="160" fill="#3b82f6" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Chip Badge -->
  <rect x="70" y="48" width="370" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  <circle cx="88" cy="64" r="5" fill="#10b981"/>
  <text x="104" y="69" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1">STATEWIDE AGTECH DATA LAKEHOUSE PLATFORM</text>

  <!-- Title -->
  <text x="70" y="130" fill="url(#brandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">CropShock</text>
  <text x="360" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="52" font-weight="800">Intelligence</text>

  <!-- Subtitle -->
  <text x="70" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="400">
    Agricultural Supply Chain Analytics, Multi-Mandi Arbitrage &amp; Perishability Shock Forecasting across Gujarat APMCs
  </text>

  <!-- Metric Card 1: Mandis -->
  <rect x="70" y="215" width="220" height="145" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="102" cy="247" r="14" fill="rgba(16, 185, 129, 0.15)"/>
  <path d="M 96 247 L 100 251 L 108 243" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600">APMC COVERAGE</text>
  <text x="96" y="302" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="36" font-weight="800">39 Mandis</text>
  <text x="96" y="332" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500">All 33 Gujarat Districts</text>

  <!-- Metric Card 2: Commodities -->
  <rect x="315" y="215" width="220" height="145" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="347" cy="247" r="14" fill="rgba(6, 182, 212, 0.15)"/>
  <path d="M 342 252 L 347 242 L 352 252 Z" fill="#06b6d4"/>
  <text x="371" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600">TRACKED CROPS</text>
  <text x="341" y="302" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="36" font-weight="800">37 Crops</text>
  <text x="341" y="332" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500">Perishability Tiers 1, 2 &amp; 3</text>

  <!-- Metric Card 3: Ingestion -->
  <rect x="560" y="215" width="220" height="145" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="592" cy="247" r="14" fill="rgba(59, 130, 246, 0.15)"/>
  <path d="M 586 244 H 598 M 586 248 H 598 M 586 252 H 594" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <text x="616" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600">LAKEHOUSE DATA</text>
  <text x="586" y="302" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="36" font-weight="800">5,661+ Recs</text>
  <text x="586" y="332" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500">Bronze &#x2192; Silver &#x2192; Gold</text>

  <!-- Metric Card 4: Architecture -->
  <rect x="805" y="215" width="325" height="145" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="837" cy="247" r="14" fill="rgba(168, 85, 247, 0.15)"/>
  <circle cx="837" cy="247" r="5" fill="#a855f7"/>
  <text x="861" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600">CORE STACK</text>
  <text x="831" y="286" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700">PySpark &#x2022; DuckDB &#x2022; Parquet</text>
  <text x="831" y="312" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="700">FastAPI JWT &#x2022; React 19</text>
  <text x="831" y="338" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="500">Kimball Star Schema &#x2022; Power BI Ready</text>
</svg>
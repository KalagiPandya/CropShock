  <text x="160" y="330" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600">COMMODITY</text>
  <text x="320" y="330" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600">ROUTING</text>
  <text x="510" y="330" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600">QUANTITY</text>
  <text x="610" y="330" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600">LANDED / MT</text>
  <text x="730" y="330" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600">TOTAL OUTLAY</text>
  <text x="860" y="330" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600">SAVINGS</text>

  <line x1="52" y1="342" x2="945" y2="342" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="52" y="356" width="70" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="60" y="371" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">SCH-0001</text>
  <text x="160" y="371" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Potato (બટાટા)</text>
  <text x="320" y="371" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12">Deesa APMC &#x2192; Ahmedabad</text>
  <text x="510" y="371" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">50.0 MT</text>
  <text x="610" y="371" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700">₹13,850</text>
  <text x="730" y="371" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="800">₹6,92,500</text>
  <text x="860" y="371" fill="#fbbf24" font-family="Inter, sans-serif" font-size="12" font-weight="700">+₹42,500</text>

  <!-- Row 2 -->
  <rect x="52" y="398" width="70" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="60" y="413" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">SCH-0002</text>
  <text x="160" y="413" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Tomato (ટામેટા)</text>
  <text x="320" y="413" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12">Anand APMC &#x2192; Vadodara</text>
  <text x="510" y="413" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">30.0 MT</text>
  <text x="610" y="413" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700">₹18,200</text>
  <text x="730" y="413" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="800">₹5,46,000</text>
  <text x="860" y="413" fill="#fbbf24" font-family="Inter, sans-serif" font-size="12" font-weight="700">+₹28,800</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pcardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <linearGradient id="winnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" rx="14" fill="#060c18"/>
  <rect width="1000" height="480" rx="14" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="35" y="30" width="280" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)"/>
  <text x="50" y="47" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">HAVERSINE ROUTE &amp; COST ENGINE</text>
  <text x="330" y="47" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Database-Persisted Sourcing Schedules</text>

  <text x="35" y="92" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="800">
    Procurement Landed Cost &amp; Arbitrage Simulator
  </text>
  <text x="35" y="118" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">

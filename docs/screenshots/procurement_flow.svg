  </text>

  <!-- Metric Callouts -->
  <!-- Stat 1 -->
  <rect x="35" y="145" width="215" height="100" rx="10" fill="url(#winnerGrad)" stroke="rgba(16, 185, 129, 0.4)"/>
  <text x="52" y="172" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">OPTIMAL SOURCE MANDI</text>
  <text x="52" y="206" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800">Deesa APMC</text>
  <text x="52" y="228" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="11">Lowest landed cost to Ahmedabad</text>

  <!-- Stat 2 -->
  <rect x="270" y="145" width="215" height="100" rx="10" fill="#0f172a" stroke="rgba(245, 158, 11, 0.3)"/>
  <text x="287" y="172" fill="#fbbf24" font-family="Inter, sans-serif" font-size="11" font-weight="700">MAX ARBITRAGE SAVINGS</text>
  <text x="287" y="206" fill="#fbbf24" font-family="Inter, sans-serif" font-size="22" font-weight="800">₹42,500</text>
  <text x="287" y="228" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Versus highest candidate mandi</text>

  <!-- Stat 3 -->
  <rect x="505" y="145" width="215" height="100" rx="10" fill="#0f172a" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="522" y="172" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700">TARGET PROCUREMENT</text>
  <text x="522" y="206" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="800">50.0 MT</text>
  <text x="522" y="228" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Destination: Ahmedabad Hub</text>

  <!-- Stat 4 -->
  <rect x="740" y="145" width="225" height="100" rx="10" fill="#0f172a" stroke="rgba(168, 85, 247, 0.3)"/>
  <text x="757" y="172" fill="#c084fc" font-family="Inter, sans-serif" font-size="11" font-weight="700">OPTIMAL LANDED / MT</text>
  <text x="757" y="206" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="800">₹13,850</text>
  <text x="757" y="228" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Includes spot price + cartage</text>

  <!-- Saved Schedules Persisted Section -->
  <rect x="35" y="265" width="930" height="185" rx="12" fill="#0f172a" stroke="rgba(16, 185, 129, 0.3)"/>
  <rect x="35" y="265" width="930" height="42" rx="12" fill="rgba(16, 185, 129, 0.12)"/>
  
  <circle cx="56" cy="286" r="5" fill="#10b981"/>
  <text x="70" y="291" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">

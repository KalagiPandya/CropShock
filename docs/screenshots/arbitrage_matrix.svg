  <text x="767" y="334" fill="#fda4af" font-family="Inter, sans-serif" font-size="12">Spot Modal: ₹1,446.67 /Qtl</text>

  <!-- Mandi Comparison Cards Row -->
  <rect x="35" y="365" width="215" height="90" rx="10" fill="#0f172a" stroke="rgba(16, 185, 129, 0.5)"/>
  <text x="50" y="392" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="700">Gondal APMC</text>
  <text x="50" y="410" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Saurashtra &#x2022; Lowest Source</text>
  <text x="50" y="438" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="800">₹1,249.04 <tspan font-size="11" fill="#94a3b8">/Qtl</tspan></text>

  <rect x="270" y="365" width="215" height="90" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
  <text x="285" y="392" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Surat APMC</text>
  <text x="285" y="410" fill="#64748b" font-family="Inter, sans-serif" font-size="11">South Gujarat</text>
  <text x="285" y="438" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="800">₹1,287.09 <tspan font-size="11" fill="#94a3b8">/Qtl</tspan></text>

  <rect x="505" y="365" width="225" height="90" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
  <text x="520" y="392" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Rajkot (Bedi) APMC</text>
  <text x="520" y="410" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Saurashtra Hub</text>
  <text x="520" y="438" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="800">₹1,378.95 <tspan font-size="11" fill="#94a3b8">/Qtl</tspan></text>

  <rect x="750" y="365" width="215" height="90" rx="10" fill="#0f172a" stroke="rgba(244, 63, 94, 0.5)"/>
  <text x="765" y="392" fill="#fb7185" font-family="Inter, sans-serif" font-size="13" font-weight="700">Ahmedabad (Jamalpur)</text>
  <text x="765" y="410" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Central Gujarat &#x2022; Terminal</text>
  <text x="765" y="438" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="800">₹1,446.67 <tspan font-size="11" fill="#94a3b8">/Qtl</tspan></text>
</svg>
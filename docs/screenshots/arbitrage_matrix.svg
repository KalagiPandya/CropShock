  <!-- Active Chip 1: Gondal -->
  <rect x="52" y="186" width="135" height="32" rx="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
  <circle cx="68" cy="202" r="4" fill="#10b981"/>
  <text x="80" y="206" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Gondal (Rajkot)</text>
  <text x="172" y="206" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="12">×</text>

  <!-- Active Chip 2: Surat -->
  <rect x="197" y="186" width="145" height="32" rx="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
  <circle cx="213" cy="202" r="4" fill="#10b981"/>
  <text x="225" y="206" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Surat Sardar Mkt</text>
  <text x="328" y="206" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="12">×</text>

  <!-- Active Chip 3: Rajkot -->
  <rect x="352" y="186" width="135" height="32" rx="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
  <circle cx="368" cy="202" r="4" fill="#10b981"/>
  <text x="380" y="206" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Rajkot Bedi APMC</text>
  <text x="473" y="206" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="12">×</text>

  <!-- Active Chip 4: Ahmedabad -->
  <rect x="497" y="186" width="160" height="32" rx="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>

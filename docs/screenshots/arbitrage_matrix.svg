  <rect x="35" y="250" width="215" height="100" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
  <text x="52" y="278" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="600">MAX INTER-MANDI SPREAD</text>
  <text x="52" y="318" fill="#ffffff" font-family="Inter, sans-serif" font-size="28" font-weight="800">₹197.63</text>
  <text x="175" y="318" fill="#64748b" font-family="Inter, sans-serif" font-size="13">/Qtl</text>
  <text x="52" y="338" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Spread between lowest &amp; highest mandi</text>

